# HTTPS virtual host, active only when the host's SSL folder (SSL_DIR, mounted
# at /etc/ssl/mdev) contains origin.crt and origin.key. Otherwise Apache does
# not even listen on :443 and serves plain HTTP on :80 only (local, CI).
#
# Production: Cloudflare (SSL mode "Full (strict)") -> Traefik TCP passthrough
# on :443 -> this vhost, using a Cloudflare Origin Certificate.

<IfFile "/etc/ssl/mdev/origin.crt">
	<IfFile "/etc/ssl/mdev/origin.key">
		Listen 443

		<VirtualHost *:443>
			DocumentRoot /var/www/html

			SSLEngine on
			SSLCertificateFile /etc/ssl/mdev/origin.crt
			SSLCertificateKeyFile /etc/ssl/mdev/origin.key
			SSLProtocol -all +TLSv1.2 +TLSv1.3
			SSLHonorCipherOrder off

			Header always set Strict-Transport-Security "max-age=31536000"

			ErrorLog ${APACHE_LOG_DIR}/error.log
			CustomLog ${APACHE_LOG_DIR}/access.log combined
		</VirtualHost>
	</IfFile>
</IfFile>
