name: Deploy

# Push to `staging` or `production` to deploy.
#
# GitHub has no per-branch secrets. Instead, the `deploy` job below sets
# `environment: ${{ github.ref_name }}`, so it runs in the GitHub Environment
# whose name equals the pushed branch and receives that environment's secrets.
# Create both environments in: Settings -> Environments -> New environment,
# then add to each (with that server's values):
#
#   secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY
#            SSH_PASSPHRASE   (only if SSH_PRIVATE_KEY is passphrase-protected)
#            SUDO_PASSWORD    (only if SSH_USER must use sudo to run docker)
#            SSH_KNOWN_HOSTS  (optional; falls back to ssh-keyscan)
#            GHCR_PULL_TOKEN  (optional PAT with read:packages, so the server
#                              can pull for manual rollbacks after the job ends)
#   vars:    DEPLOY_PATH      (e.g. /home/ubuntu/mdev; must contain .env)
#            SSH_PORT         (optional, default 22)

on:
  push:
    branches: [staging, production]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push image
    needs: checks
    # Manual runs can target any branch; only deploy branches may ship. Without
    # this, a run on e.g. `main` would auto-create a `main` environment and fall
    # back to repository-level secrets. `deploy` needs `build`, so it skips too.
    if: github.ref_name == 'staging' || github.ref_name == 'production'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: image
        name: Resolve immutable image reference
        run: |
          image="$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "ref=${image}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
      url: ${{ vars.SITE_URL }}
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
    steps:
      # Missing secrets/vars resolve to "" rather than erroring, so check them
      # explicitly before touching the server.
      - name: Validate deploy settings
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ENV_NAME: ${{ github.ref_name }}
        run: |
          errors=0
          fail() { echo "::error title=Deploy settings::$1"; errors=$((errors + 1)); }

          [ -n "${SSH_HOST// }" ]        || fail "Secret SSH_HOST is empty or not set for environment '$ENV_NAME'."
          [ -n "${SSH_USER// }" ]        || fail "Secret SSH_USER is empty or not set for environment '$ENV_NAME'."
          [ -n "${SSH_PRIVATE_KEY// }" ] || fail "Secret SSH_PRIVATE_KEY is empty or not set for environment '$ENV_NAME'."

          if [ -z "${DEPLOY_PATH// }" ]; then
            fail "Variable DEPLOY_PATH is empty or not set for environment '$ENV_NAME'."
          elif [[ "$DEPLOY_PATH" != /* ]]; then
            fail "DEPLOY_PATH must be an absolute path (got '$DEPLOY_PATH')."
          elif [[ "$DEPLOY_PATH" =~ ^/+$ ]]; then
            fail "DEPLOY_PATH must not be the filesystem root."
          elif [[ "$DEPLOY_PATH" == *..* ]]; then
            fail "DEPLOY_PATH must not contain '..' (got '$DEPLOY_PATH')."
          fi

          [ "$errors" -eq 0 ] || exit 1
          echo "Deploying to ${DEPLOY_PATH} on environment '${ENV_NAME}'."

      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          # Strip Windows line endings that copy/paste can introduce.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Turn the generic "Permission denied (publickey)" into a specific error.
          if ! grep -q 'PRIVATE KEY' ~/.ssh/id_deploy && grep -qE '^(ssh-|ecdsa-|sk-)' ~/.ssh/id_deploy; then
            echo "::error title=SSH_PRIVATE_KEY::This is a PUBLIC key (.pub). Put the private key file (same name, no .pub) in the secret; the .pub line belongs in the server's ~/.ssh/authorized_keys."
            exit 1
          fi

          # Passphrase-protected key: unlock this temporary copy on the throwaway
          # runner (removed again by the cleanup step). The secret stays encrypted.
          if [ -n "$SSH_PASSPHRASE" ] && ! ssh-keygen -y -P '' -f ~/.ssh/id_deploy >/dev/null 2>&1; then
            if ! err="$(ssh-keygen -p -q -P "$SSH_PASSPHRASE" -N '' -f ~/.ssh/id_deploy 2>&1)"; then
              if grep -qiE 'passphrase|incorrect' <<<"$err"; then
                echo "::error title=SSH_PASSPHRASE::The passphrase does not unlock SSH_PRIVATE_KEY. Check the SSH_PASSPHRASE secret."
              else
                echo "::error title=SSH_PRIVATE_KEY::Not a valid private key (${err}). Paste the whole file, including the BEGIN and END lines."
              fi
              exit 1
            fi
          fi

          if ! err="$(ssh-keygen -y -P '' -f ~/.ssh/id_deploy 2>&1 >/dev/null)"; then
            if grep -qi 'passphrase' <<<"$err"; then
              echo "::error title=SSH_PRIVATE_KEY::The key is passphrase-protected. Add its passphrase as the SSH_PASSPHRASE secret in this environment."
            else
              echo "::error title=SSH_PRIVATE_KEY::Not a valid private key (${err}). Paste the whole file, including the BEGIN and END lines."
            fi
            exit 1
          fi
          echo "Deploy key fingerprint: $(ssh-keygen -y -f ~/.ssh/id_deploy | ssh-keygen -lf - | awk '{print $2}')"
          echo "It must match a line of: ssh-keygen -lf ~/.ssh/authorized_keys  (run on the server as SSH_USER)"

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          printf 'Host target\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' \
            "$SSH_HOST" "${{ secrets.SSH_USER }}" "$SSH_PORT" > ~/.ssh/config

      - name: Upload compose files and scripts
        run: |
          # shellcheck disable=SC2029 # values are meant to expand locally, then be quoted remotely
          ssh target "mkdir -p '$DEPLOY_PATH/scripts'"
          rsync -az docker-compose.yml target:"$DEPLOY_PATH/"
          rsync -az --delete scripts/ target:"$DEPLOY_PATH/scripts/"

      - name: Pull and restart
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        run: |
          # Secrets travel over SSH stdin (line 1: sudo password, line 2: registry
          # token), never in a remote command line or process list. deploy.sh uses
          # sudo only when the SSH user cannot run docker directly.
          # shellcheck disable=SC2029 # values are meant to expand locally, then be quoted remotely
          printf '%s\n%s\n' "$SUDO_PASSWORD" "$REGISTRY_TOKEN" \
            | ssh target "cd '$DEPLOY_PATH' && REGISTRY_USER='$REGISTRY_USER' ./scripts/deploy.sh --stdin-secrets '$IMAGE'"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
