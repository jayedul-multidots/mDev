# Local development overrides (merged automatically by `docker compose`).
# Never deployed: servers run docker-compose.yml only.
#
# Custom code is bind-mounted so edits are live; third-party plugins are
# installed into ./wp-content/plugins by `make composer-install`.

services:
  wordpress:
    build:
      target: dev
    volumes:
      # The entire wp-content from the host (plugins, themes, mu-plugins,
      # uploads, caches, ...), so anything added locally is live. This hides the
      # image's own wp-content, including WordPress's bundled default themes.
      - ./wp-content:/var/www/html/wp-content
      # Same target as the base file's `uploads` volume, so this replaces it:
      # uploads live in ./wp-content/uploads locally.
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
      # Whole repo outside the docroot, so vendor/ and tooling are never web-exposed.
      # Used by `composer test` etc. inside the container (MDEV_ROOT=/app).
      - ./:/app
      # Linux node_modules for the container, hiding the host's macOS copy
      # (native packages like esbuild/rollup are OS-specific). Same volume at
      # both paths the plugin is reachable from. Install once inside:
      #   docker compose exec -w /var/www/html/wp-content/plugins/mdev-gb wordpress npm ci
      - mdev_gb_node_modules:/var/www/html/wp-content/plugins/mdev-gb/node_modules
      - mdev_gb_node_modules:/app/wp-content/plugins/mdev-gb/node_modules

  # Database UI, local only: http://localhost:8081 (PMA_PORT in .env).
  # Bound to 127.0.0.1, so nothing outside this machine can reach it, and
  # logged in automatically as the WordPress DB user (this database only).
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: ${COMPOSE_PROJECT_NAME}-db
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 128M
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"

  # One-off tooling containers, so the host needs neither PHP nor Composer.
  #   docker compose run --rm composer install
  #   docker compose run --rm node npm run start
  composer:
    image: composer:2
    profiles: ["tools"]
    working_dir: /app
    user: "${MDEV_UID:-1000}:${MDEV_GID:-1000}"
    environment:
      COMPOSER_HOME: /tmp/composer
      # Bind-mounted repo is owned by the host user; let git (used by Composer) read it.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - ./:/app
    entrypoint: ["composer"]

  node:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /app/wp-content/plugins/mdev-gb
    user: "${MDEV_UID:-1000}:${MDEV_GID:-1000}"
    environment:
      npm_config_cache: /tmp/npm-cache
    volumes:
      - ./:/app

volumes:
  mdev_gb_node_modules:
